[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-sensory-memory"
version = "0.1.0"
description = "Fixed-budget online sensory memory with action-conditioned reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["loki_memory"]
