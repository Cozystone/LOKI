[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-sensory-memory"
version = "0.4.0"
description = "Continuous residual memory with action-dependent phase transport"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["loki_memory"]
